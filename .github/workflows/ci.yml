name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest + ruff (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable) + dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt -r requirements-dev.txt
          pip install --no-build-isolation -e .

      # pvlib 0.16.1 independent CEC cross-checks run on Python 3.11 and 3.12
      - name: Install validation dependencies
        if: matrix.python-version == '3.11' || matrix.python-version == '3.12'
        run: pip install -r requirements-validation.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: python -m pytest -v

      - name: Smoke-test pv-mppt CLI entry point
        run: |
          pv-mppt --version
          pv-mppt info --json
          pv-mppt iv --irradiance 850 --temp 40 --json
          pv-mppt boost --v-bus 60 --json

      - name: Smoke-run main benchmark
        run: python main.py
